apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sophia-runtime-adapters.fullname" . }}-secrets
  labels:
    {{- include "sophia-runtime-adapters.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUNTIME_POSTGRES_DSN: {{ required ".Values.secrets.postgresDsn is required" .Values.secrets.postgresDsn | quote }}
{{- if and .Values.llm.enabled .Values.openCodeAuth.authJsonBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sophia-runtime-adapters.fullname" . }}-opencode-auth
  labels:
    {{- include "sophia-runtime-adapters.labels" . | nindent 4 }}
type: Opaque
data:
  # The opencode CLI reads its OAuth credential store from
  # $HOME/.local/share/opencode/auth.json (dev convention) or whatever
  # path is volume-mounted at that location.
  auth.json: {{ .Values.openCodeAuth.authJsonBase64 }}
{{- end }}
