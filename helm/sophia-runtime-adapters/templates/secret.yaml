apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sophia-runtime-adapters.fullname" . }}-secrets
  labels:
    {{- include "sophia-runtime-adapters.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUNTIME_POSTGRES_DSN: {{ required ".Values.secrets.postgresDsn is required" .Values.secrets.postgresDsn | quote }}
{{- if and (eq .Values.llm.target "opencode") .Values.openCodeAuth.authJsonBase64 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sophia-runtime-adapters.fullname" . }}-opencode-auth
  labels:
    {{- include "sophia-runtime-adapters.labels" . | nindent 4 }}
type: Opaque
data:
  # The opencode CLI reads its OAuth credential store from
  # $HOME/.local/share/opencode/auth.json (dev convention) or whatever
  # path is volume-mounted at that location.
  auth.json: {{ .Values.openCodeAuth.authJsonBase64 }}
{{- end }}
{{- if and (eq .Values.llm.target "aider") .Values.secrets.aiderEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sophia-runtime-adapters.fullname" . }}-aider-env
  labels:
    {{- include "sophia-runtime-adapters.labels" . | nindent 4 }}
type: Opaque
stringData:
  # API keys for aider-chat. Provide at least one of:
  #   ANTHROPIC_API_KEY — for Claude models (recommended with aider)
  #   OPENAI_API_KEY    — for GPT-4 / GPT-4o models
  # Set via secrets.aiderEnv in values.yaml or `--set secrets.aiderEnv.ANTHROPIC_API_KEY=sk-ant-...`.
  {{- range $key, $val := .Values.secrets.aiderEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
