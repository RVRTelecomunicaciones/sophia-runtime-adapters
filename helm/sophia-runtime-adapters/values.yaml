# Default values for sophia-runtime-adapters.
# Override via `helm install -f my-values.yaml` or `--set key=value`.

image:
  # The Dockerfile ships FOUR runtime targets. Set image.tag to the
  # appropriate suffix and set llm.target to match:
  #
  #   Target name                    Tag suffix          llm.target
  #   ----------------------------   -----------------   -----------
  #   runtime-adapters               (none / "0.1.0")    (unset)
  #   runtime-adapters-llm-opencode  0.1.0-llm-opencode  opencode
  #   runtime-adapters-llm-ollama    0.1.0-llm-ollama    ollama
  #   runtime-adapters-llm-aider     0.1.0-llm-aider     aider
  #
  # The `-llm` tag suffix is a backward-compatible alias for
  # `-llm-opencode`; existing deployments that already set tag to
  # "0.1.0-llm" continue to work without a values.yaml change.
  repository: ghcr.io/rvrtelecomunicaciones/sophia-runtime-adapters
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# llm.target selects the LLM dispatcher variant. Accepted values:
#
#   ""         (empty / unset) — distroless target, no LLM mounts.
#              This is the default. Use image.tag without a suffix.
#
#   "opencode" — opencode CLI bundled. Mounts opencode-config
#              ConfigMap and (optionally) opencode auth.json Secret.
#              Requires image.tag ending in "-llm-opencode" (or the
#              backward-compatible "-llm" alias).
#
#   "ollama"   — ollama binary bundled; daemon runs EXTERNALLY. The
#              chart injects OLLAMA_HOST env var (see llm.ollamaHost).
#              Requires image.tag ending in "-llm-ollama".
#              No auth.json or opencode ConfigMap is mounted.
#
#   "aider"    — aider-chat installed via pipx at /usr/local/bin/aider.
#              Requires image.tag ending in "-llm-aider". API keys
#              (ANTHROPIC_API_KEY / OPENAI_API_KEY) must be supplied
#              via secrets.aiderEnv (same pattern as secrets.postgresDsn).
#              No auth.json or opencode ConfigMap is mounted.
llm:
  target: ""

  # ollamaHost is the OLLAMA_HOST injected when llm.target="ollama".
  # Point this at the Service / Deployment running the ollama daemon
  # (e.g. the ollama/ollama Helm chart deployed in namespace "ollama").
  # The adapter hits this endpoint; no GPU drivers are needed in the
  # runtime-adapters-llm-ollama image itself.
  ollamaHost: "http://ollama.ollama.svc.cluster.local:11434"

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: "2"      # higher than orch — runtime spawns LLM subprocesses (when LLM target)
    memory: "1Gi"
  requests:
    cpu: "200m"
    memory: "256Mi"

config:
  httpAddr: ":8080"
  env: production       # development | staging | production
  version: "0.1.0"
  provenanceSource: http
  chaosEnabled: false
  otelEnabled: false
  # Allowed-paths for shell.exec@v1. The LLM targets ship opencode /
  # ollama / aider in /usr/local/bin so include that there. The
  # distroless target only has the runtime binary itself; shell.exec@v1
  # is effectively unable to spawn external processes regardless of
  # this whitelist.
  allowedCommandsPath: "/usr/local/bin:/usr/bin:/bin"
  allowedWorkingDirs: "/tmp"
  allowedFilesystemRoots: "/tmp"

# Database connection. runtime-adapters uses pgx and embedded
# golang-migrate (migrations run in-process at boot via wire.go).
secrets:
  postgresDsn: ""   # postgres://user:pass@host:5432/runtime_adapters?sslmode=require

  # aiderEnv is only used when llm.target="aider". Supply at least one of:
  #   ANTHROPIC_API_KEY: "sk-ant-..."   # Claude models (recommended)
  #   OPENAI_API_KEY:    "sk-..."       # GPT-4 models
  # These are injected into the container via a dedicated Secret and
  # loaded via envFrom (same pattern as postgresDsn). Empty map disables
  # the Secret (no mount occurs when llm.target != "aider").
  aiderEnv: {}

# OpenCode auth.json — mounted as a Secret so the opencode subprocess
# inherits the operator's OAuth credentials. ONLY needed when
# llm.target="opencode" (or the backward-compatible "llm.enabled=true"
# path). Ignored for ollama and aider targets.
# Dev: base64-encode your ~/.local/share/opencode/auth.json and paste
# under `openCodeAuthJson`. Prod: prefer a SecretRef from External
# Secrets Operator pulling from Vault/AWS SM.
openCodeAuth:
  # Base64-encoded JSON content. Empty disables the mount (opencode
  # then falls back to provider env vars like ANTHROPIC_API_KEY).
  authJsonBase64: ""

# OpenCode permissions config — pre-grants bash/edit/write/read/
# external_directory to "allow" so the headless subprocess does not
# hang on the upstream `ask`-default permission prompt
# (anomalyco/opencode#14473). Mounted as ConfigMap (no secrets here).
# Only rendered when llm.target="opencode".
openCodeConfig:
  permissionAllow:
    bash: true
    edit: true
    write: true
    read: true
    externalDirectory: true

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  # When llm.target is set, LLM subprocesses write to ~/.config and
  # /tmp on first run; readOnlyRootFilesystem must be false in that
  # case. The chart auto-flips this in the deployment template.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
