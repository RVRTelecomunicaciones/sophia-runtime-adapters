# ops/otel-collector/config.yaml
#
# OpenTelemetry Collector Contrib configuration for the 2C.2
# measurement environment. Pipeline:
#   otlp (grpc) → batch → prometheus exporter (:8889)
#
# The `prometheus` exporter is PULL-based: Prometheus scrapes this
# collector via ops/local/prometheus.yaml. We deliberately avoid
# `prometheusremotewrite` (ADR 0007 / D2C2.8) — its OTel histogram
# translation has known issues with buckets + exemplars + timestamp
# alignment, and calibration cannot tolerate that drift.
#
# resource_to_telemetry_conversion ensures OTel resource attributes
# (service.name, etc) propagate to Prometheus labels for filtering.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    # Small timeout keeps the pull-scrape fresh; collector-side
    # batching is more about syscall amortization than latency.
    timeout: 2s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true
    # Enable exemplars on histograms so execution.duration exemplars
    # carry trace_id (+ receipt_id as FilteredAttributes).
    enable_open_metrics: true

extensions:
  # Health check at :13133/ for compose healthcheck (wget probe).
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  # NOTE: service.telemetry.metrics is intentionally NOT set here.
  # In OTel Collector Contrib 0.106 the default telemetry config
  # already exposes the collector's own metrics on :8888/metrics
  # (bound to 0.0.0.0 inside the container). An explicit `readers:`
  # block targeting the same port would DUPLICATE that default and
  # cause a "bind: address already in use" crash on startup (the
  # runtime would see two 'Serving metrics {"address":"0.0.0.0:8888"}'
  # lines followed by a fatal bind error). Leaving defaults keeps
  # prometheus.yaml's scrape target otel-collector:8888 working
  # without any collision risk.
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
