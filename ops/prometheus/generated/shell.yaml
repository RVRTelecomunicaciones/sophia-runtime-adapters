- name: sloth-slo-alerts-runtime-adapters-shell-exec-cancellation-rate
  rules:
  - alert: ShellExecCancellationRateBurn
    expr: |
      (
          max(slo:sli_error:ratio_rate5m{sloth_id="runtime-adapters-shell-exec-cancellation-rate", sloth_service="runtime-adapters", sloth_slo="shell-exec-cancellation-rate"} > (14.4 * 0.01)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate1h{sloth_id="runtime-adapters-shell-exec-cancellation-rate", sloth_service="runtime-adapters", sloth_slo="shell-exec-cancellation-rate"} > (14.4 * 0.01)) without (sloth_window)
      )
      or
      (
          max(slo:sli_error:ratio_rate30m{sloth_id="runtime-adapters-shell-exec-cancellation-rate", sloth_service="runtime-adapters", sloth_slo="shell-exec-cancellation-rate"} > (6 * 0.01)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate6h{sloth_id="runtime-adapters-shell-exec-cancellation-rate", sloth_service="runtime-adapters", sloth_slo="shell-exec-cancellation-rate"} > (6 * 0.01)) without (sloth_window)
      )
    labels:
      capability: shell.exec@v1
      severity: critical
      sloth_severity: page
    annotations:
      summary: '{{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget burn
        rate is over expected.'
      title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
        burn rate is too fast.
  - alert: ShellExecCancellationRateBurn
    expr: |
      (
          max(slo:sli_error:ratio_rate2h{sloth_id="runtime-adapters-shell-exec-cancellation-rate", sloth_service="runtime-adapters", sloth_slo="shell-exec-cancellation-rate"} > (3 * 0.01)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate1d{sloth_id="runtime-adapters-shell-exec-cancellation-rate", sloth_service="runtime-adapters", sloth_slo="shell-exec-cancellation-rate"} > (3 * 0.01)) without (sloth_window)
      )
      or
      (
          max(slo:sli_error:ratio_rate6h{sloth_id="runtime-adapters-shell-exec-cancellation-rate", sloth_service="runtime-adapters", sloth_slo="shell-exec-cancellation-rate"} > (1 * 0.01)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate3d{sloth_id="runtime-adapters-shell-exec-cancellation-rate", sloth_service="runtime-adapters", sloth_slo="shell-exec-cancellation-rate"} > (1 * 0.01)) without (sloth_window)
      )
    labels:
      capability: shell.exec@v1
      severity: warning
      sloth_severity: ticket
    annotations:
