# ops/prometheus/prometheus.chaos.yml
#
# Overlay-only Prometheus config for chaos tests.
# Bound by ops/local/compose.chaos.yaml in place of the base prometheus.yaml
# (D2C3.26 — deterministic file swap via volume; no env-var YAML interpolation).
#
# Changes from base ops/local/prometheus.yaml:
#   - scrape_interval / evaluation_interval reduced to 1s for short-window canary budgets
#   - external_labels updated to identify the chaos environment
#   - alerting block added targeting alertmanager:9093
#   - rule_files block globs the per-spec rendered test rule files under
#     ops/prometheus/generated/test/ (one file per SLO spec, rendered via
#     `make chaos-render-rules`); concatenation into a single file is invalid
#     because Sloth emits one top-level `groups:` per spec.
#   - scrape_configs match the base exactly (same job names, same targets/ports)
# Production prometheus.yaml is unchanged.

global:
  scrape_interval:     1s
  evaluation_interval: 1s
  external_labels:
    cluster: chaos-test

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  # Glob each per-spec rendered test rule file. The chaos compose overlay
  # mounts ops/prometheus/generated/test/ → /etc/prometheus/test-rules/.
  # Sloth emits one file per input spec (filesystem.yaml, git.yaml,
  # http.yaml, shell.yaml); each file has its own top-level `groups:`,
  # so concatenating them under one filename would not be valid.
  - /etc/prometheus/test-rules/*.yaml

scrape_configs:
  # Runtime metrics via the collector's prometheus exporter.
  # See ops/otel-collector/config.yaml — exporter listens on :8889.
  - job_name: runtime-adapters
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: runtime-adapters

  # Self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Collector's own internal metrics.
  - job_name: otel-collector-self
    static_configs:
      - targets: ['otel-collector:8888']
