# Pool saturation alerts for the pgx connection pool used by
# runtime-adapters' PostgreSQL outbound. Metric contract: see
# internal/infrastructure/obs/metrics.go — instrument
# runtime_adapters.pool.connections.acquired.duration (histogram, seconds).
#
# Spec §8 (infra alerts, hand-written).

groups:
  - name: runtime-adapters-pool
    interval: 30s
    rules:
      - alert: PoolAcquireLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(runtime_adapters_pool_connections_acquired_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pgx pool acquire p95 > 1s durante 5m"
          description: "Acquire latency sostenida. Revisar concurrencia upstream o salud de DB."

      - alert: PoolConnectionsExhausted
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(runtime_adapters_pool_connections_acquired_duration_seconds_bucket[5m])
            )
          ) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "pgx pool saturada (p95 acquire > 5s durante 2m)"
          description: "El pool pgx está al límite. Puede ser carga legítima o DB degradada."

      # DORMANT IN PRODUCTION (2C.1): the metric `pgx_pool_idle_conns` is
      # NOT emitted by the current runtime — pgx/v5 exposes pool stats via
      # pgxpool.Stat() but no Prometheus collector is registered in
      # bootstrap. Track 2C.4 (operational readiness) will wire a
      # pgxpoolprometheus collector or equivalent. Until then this rule
      # evaluates to no-data and never fires. Keeping the rule shape
      # stable so the Alertmanager routing contract (§9) is authored once.
      - alert: PoolIdleZero
        expr: |
          min_over_time(pgx_pool_idle_conns[1m]) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "pgx pool sin conexiones idle durante 1m"
          description: "Saturación completa transitoria — si persiste escalar a critical. NOTE: dormant hasta wiring de pgxpool collector en 2C.4."
