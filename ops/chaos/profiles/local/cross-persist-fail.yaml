version: 1
name: local-cross-persist-fail
description: |
  ChaosReceiptStore returns ErrChaosPersistFailure on every Persist.
  The adapter call itself succeeds; the failure is at the persist
  boundary. Validates A4.3 persistence-before-return: caller
  receives 5xx, no receipt visible in the DB,
  runtime_adapters.receipt.persist.failures counter increments.

  Local-only counterpart to ci-persist-fail. expected_outcome metadata
  mirrors the success path of the underlying capability since the
  adapter itself does not fault — the integration test for this
  profile asserts on the persist-side contract (5xx + counter)
  rather than on the receipt classification, because no receipt is
  produced.
adapters: {}
persistence:
  fault: persist_failure
expected_outcome:
  status: success
  error_class: ""
  retry_hint: unknown
