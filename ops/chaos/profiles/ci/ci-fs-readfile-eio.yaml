version: 1
name: ci-fs-readfile-eio
description: |
  filesystem.read_file@v1 sees a synthesised EIO from the underlying
  read.

  EIO is treated as external infrastructure I/O failure, not adapter
  bug. The adapter does not own the disk; a hardware-level read error
  classifies as ExternalFailure with retryable hint, consistent with
  how the FS adapter classifies real EIO encountered in production
  (D2C3.15).
adapters:
  filesystem.read_file@v1:
    fault: eio
    timing: post_dispatch
expected_outcome:
  status: failure
  error_class: external_failure
  retry_hint: unknown
persistence: null
