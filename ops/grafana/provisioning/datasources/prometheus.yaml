apiVersion: 1

# Prometheus datasource for recording rules, alerts, and metric queries.
# Exemplars link to Tempo via exemplarTraceIdDestinations (§10.9).

datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
