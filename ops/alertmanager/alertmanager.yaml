# Alertmanager three-tier routing for runtime-adapters (Phase 2C.1).
#
# Severity taxonomy (§9):
#   critical → paged oncall (2C.4 swaps to real pager receiver)
#   warning  → ticket queue  (2C.4 swaps to real tickets receiver)
#   info     → dashboard-only, silenced at root via null-receiver
#
# Inhibition: when a fast-burn (critical) alert fires for a given
# {sloth_slo, capability} pair, the slow-burn (warning) alert for the
# same pair is suppressed. Hand-written infra alerts (which do not
# carry sloth_slo) are NOT inhibited across tiers — they are
# independent signals per §9.3.
#
# Grouping includes `capability` so per-capability SLO alerts do not
# get merged into a single notification across capabilities of the
# same adapter (D2C1.16).
#
# All unwired tiers currently route to null-receiver. The tree shape,
# grouping, inhibit rules, and timing are fully exercised by
# amtool check-config + the Go routing coverage test
# (ops/alertmanager/alertmanager_routing_test.go). Track 2C.4 will
# swap receivers for real integrations without changing the tree.

global:
  resolve_timeout: 5m

route:
  receiver: null-receiver
  group_by: ['alertname', 'adapter', 'capability']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [ 'severity="critical"' ]
      receiver: ops-critical    # PagerDuty + Slack #incidents (D2C4AB.2)
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 30m
      continue: false
    - matchers: [ 'severity="warning"' ]
      receiver: ops-warnings    # Slack #ops + Linear webhook (D2C4AB.3); webhook lands in B2
      group_wait: 1m
      group_interval: 15m
      repeat_interval: 4h
      continue: false
    # severity=info falls through to root receiver (null-receiver) —
    # silenced by design.

receivers:
  # null-receiver remains the silenced sink for severity=info (I-AB.1)
  # and the root catch-all for any future severity that falls through.
  - name: null-receiver

  # ops-critical: pages on-call via PagerDuty Events API v2 AND posts
  # to Slack #incidents in parallel for team visibility (D2C4AB.2 +
  # A2C4AB.1). Credentials are read from files mounted via Docker
  # Compose secrets (see Task 1.6 + 1.6.5). Alertmanager v0.27.0
  # auto-trims trailing whitespace for slack api_url_file (since
  # v0.25.0); the Make target writes the routing_key file with
  # printf "%s" as defense-in-depth. See spec A2C4AB.4 for the
  # rationale on file-based vs $VAR template syntax.
  - name: ops-critical
    pagerduty_configs:
      - routing_key_file: /run/secrets/pagerduty_routing_key
        severity: '{{ .CommonLabels.severity }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          capability: '{{ .CommonLabels.capability }}'
          adapter:    '{{ .CommonLabels.adapter }}'
          sloth_slo:  '{{ .CommonLabels.sloth_slo }}'
          external_url: '{{ .ExternalURL }}'
    slack_configs:
      - api_url_file: /run/secrets/slack_incidents_webhook_url
        channel: "#incidents"
        title: '🚨 [CRIT] {{ .CommonLabels.alertname }}'
        text: |
          *Capability:* `{{ .CommonLabels.capability }}`
          *Summary:* {{ .CommonAnnotations.summary }}
          <{{ .ExternalURL }}|View in Alertmanager>
        send_resolved: true

  # ops-warnings: posts to Slack #ops AND to Linear via the webhook
  # adapter (B2 wires the webhook). Slack credential read from
  # mounted secret file (A2C4AB.4). Linear webhook URL is the
  # cluster-internal compose DNS — NOT a credential, stays inline.
  - name: ops-warnings
    slack_configs:
      - api_url_file: /run/secrets/slack_ops_webhook_url
        channel: "#ops"
        title: '⚠️ [WARN] {{ .CommonLabels.alertname }}'
        text: |
          *Capability:* `{{ .CommonLabels.capability }}`
          *Summary:* {{ .CommonAnnotations.summary }}
          <{{ .ExternalURL }}|View in Alertmanager>
        send_resolved: true
    webhook_configs:
      - url: 'http://linear-webhook:9095/webhook'
        send_resolved: true
        max_alerts: 0   # send all in group, no truncation

inhibit_rules:
  - source_matchers: [ 'severity="critical"' ]
    target_matchers: [ 'severity="warning"' ]
    equal: ['sloth_slo', 'capability']
