# ops/local/mock/default.conf
#
# Deterministic HTTP upstream for measuring http.request@v1 latency.
# Requirements (§6.8):
#   - 200 OK
#   - fixed ~1 KiB body, byte-identical across requests
#   - no payload reflection
#   - no dump / echo / delay endpoints
#   - no randomized content or timestamps
#
# nginx serving a literal `return 200` is O(1) in CPU and deterministic
# in latency — isolates variance to the runtime HTTP adapter path.

server {
    listen 8080 default_server;
    server_name _;

    # Quiet the access log: in load scenarios we do not want the mock
    # to spend cycles on logging. Errors still go to stderr.
    access_log off;

    location / {
        default_type application/json;

        # ~1 KiB fixed payload. The character padding keeps the body
        # size stable so Prometheus rate(http_response_size_bytes) on
        # the mock side stays flat.
        return 200 '{"status":"ok","payload":"x0123456789abcdef____________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________"}';
    }

    # Explicitly block anything that could introduce determinism risk.
    location ~* ^/(anything|post|put|delay|echo|dump|stream) {
        return 404;
    }
}
