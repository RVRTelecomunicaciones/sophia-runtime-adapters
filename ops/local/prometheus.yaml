# ops/local/prometheus.yaml
#
# Scrape config for the 2C.2 measurement environment. The runtime
# metrics are scraped from the otel-collector's Prometheus exporter
# endpoint (port 8889), NOT from the runtime directly — the runtime
# only speaks OTLP. See ADR 0007.
#
# Rule files reuse the 2C.1 outputs: hand-written infra rules +
# Sloth-generated SLO rules.

global:
  scrape_interval:     5s
  evaluation_interval: 5s
  external_labels:
    environment: local-calibration
    envelope:    "2cpu-2gib-pinned"

scrape_configs:
  # Runtime metrics via the collector's prometheus exporter.
  # See ops/otel-collector/config.yaml — exporter listens on :8889.
  - job_name: runtime-adapters
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: runtime-adapters

  # Self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Collector's own internal metrics (zpages / healthcheck_extension
  # surface a /metrics on the default port when enabled in config).
  - job_name: otel-collector-self
    static_configs:
      - targets: ['otel-collector:8888']

# Enumerate rule files explicitly — we cannot glob `*.yaml` here because
# the 2C.1 convention placed promtool test fixtures (`*.test.yaml`) in
# the same directories as real rule files. Go's filepath.Match has no
# negation, and Prometheus refuses to start (exit 2) when it parses a
# test fixture as a RuleGroups file ("field rule_files not found in
# type rulefmt.RuleGroups" — test fixtures have their own schema with
# rule_files/tests/evaluation_interval at the top level).
# Adding a new rule requires updating this list.
rule_files:
  - /etc/prometheus/rules/infra_pool.yaml
  - /etc/prometheus/rules/infra_otel.yaml
  - /etc/prometheus/rules/infra_migrate.yaml
  - /etc/prometheus/rules/infra_panics.yaml
  - /etc/prometheus/rules/infra_persistence.yaml
  - /etc/prometheus/generated/shell.yaml
  - /etc/prometheus/generated/git.yaml
  - /etc/prometheus/generated/filesystem.yaml
  - /etc/prometheus/generated/http.yaml
