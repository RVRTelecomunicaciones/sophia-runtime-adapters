# ops/local/compose.yaml
#
# PURPOSE — MEASUREMENT / CALIBRATION ENVIRONMENT for Phase 2C.2 load baseline.
#
# This compose is the pinned envelope under which SLO targets in
# ops/slo/*.yaml are calibrated. It is NOT the operational local stack
# — that closure is Phase 2C.4, which will add Alertmanager + Tempo +
# real receivers + runbooks. Keep this file focused on what the
# measurement run needs; resist adding services that don't contribute
# to calibration evidence.
#
# Resource limits use docker compose v2 non-swarm syntax
# (`cpus:` + `mem_limit:` at the service level). The `deploy.resources`
# block is swarm-only and would be silently ignored here — we use the
# form compose honors. Verification of the effective limits runs
# before each k6 scenario via ops/load/lib/verify-limits.sh.
#
# Metrics pipeline (§7):
#   runtime-adapters → OTLP gRPC → otel-collector (Prom exporter :8889)
#   ← scrape every 5s ← prometheus
# We deliberately do NOT use `prometheusremotewrite` (D2C2.8 / ADR 0007)
# because its histogram handling is not reliable enough for calibration.

name: runtime-load

services:

  # ---- postgres: receipt persistence dependency (A4.3) ------------------
  postgres:
    image: postgres:15-alpine
    cpus: "1.0"
    mem_limit: 512m
    environment:
      POSTGRES_DB: runtime_adapters
      POSTGRES_USER: runtime
      POSTGRES_PASSWORD: runtime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime -d runtime_adapters"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - runtime-load

  # ---- http-upstream-mock: deterministic nginx for http.request@v1 ------
  # §6.8: fixed 200 OK, ~1 KiB static body, no reflection / dump / delay.
  http-upstream-mock:
    image: nginx:1.27-alpine
    cpus: "0.5"
    mem_limit: 256m
    volumes:
      - ./mock/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Use 127.0.0.1 explicitly: inside alpine `localhost` can
      # resolve to IPv6 ::1 while nginx binds only IPv4 0.0.0.0:8080
      # by default, producing a spurious "Connection refused".
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    networks:
      - runtime-load

  # ---- otel-collector: OTLP gRPC receiver → prometheus exporter ---------
  # NOTE: image is distroless-style — NO shell, NO wget, NO curl inside
  # the container. A self-healthcheck probe via `docker exec wget ...`
  # fails with "exec: wget: executable file not found in $PATH".
  # Consequence: no `healthcheck:` block here. runtime-adapters depends
  # on this service via `service_started` (not `service_healthy`) —
  # startup ordering is still guaranteed by depends_on; readiness is
  # the runtime's own retry at the OTLP client layer (it tolerates a
  # brief "collector not ready" window). The collector DOES serve a
  # real health endpoint at :13133/ — external services (including
  # prometheus scrape of its own :8889/metrics) can probe it if needed.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    cpus: "0.5"
    mem_limit: 256m
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ../otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    networks:
      - runtime-load

  # ---- runtime-adapters: system under test ------------------------------
  runtime-adapters:
    build:
      context: ../..             # repo root, so Dockerfile at ./Dockerfile is found
      dockerfile: Dockerfile
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      # Wire postgres receipt store
      RUNTIME_POSTGRES_DSN: "postgres://runtime:runtime@postgres:5432/runtime_adapters?sslmode=disable"
      # Enable OTLP export to the in-network collector
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # Logger contract (2C.1 R10): force json + info for ops-realistic output
      RUNTIME_LOG_FORMAT: "json"
      RUNTIME_LOG_LEVEL:  "info"
      RUNTIME_LOG_ADD_SOURCE: "false"
      # Allowlists — keys MUST match internal/infrastructure/config/load.go.
      # Bundle 2 shipped with RUNTIME_SHELL_ALLOWED_COMMANDS / *_FS_* / *_GIT_*
      # which are NOT config keys; the loader silently fell back to the
      # $HOME default (/home/nonroot), rejecting every bench path. Bundle 4
      # T27 verification caught this. Correct names + colon separator below.
      # RUNTIME_ALLOWED_COMMANDS_PATH is omitted — shell.exec scenarios use
      # absolute paths which bypass the lookup (see shell/safety.go:18-22).
      RUNTIME_ALLOWED_FILESYSTEM_ROOTS: "/tmp/bench-fs"
      RUNTIME_ALLOWED_WORKING_DIRS:     "/bench/git:/tmp"
      RUNTIME_HTTP_ALLOW_PRIVATE_NETWORKS: "true"   # bridge network is RFC1918
      RUNTIME_HTTP_HOST_ALLOWLIST: "http-upstream-mock"
    volumes:
      - ../../test/fixtures/git-bench:/bench/git:ro     # Bundle 4 populates
    tmpfs:
      # Scratch space for filesystem.write_file@v1 scenarios. Using a
      # tmpfs (vs a named volume) avoids root-owned-volume permission
      # issues: the distroless runtime runs as UID 65532 and cannot
      # write to a volume that Docker provisions with root ownership.
      # tmpfs lets us set uid/gid + size at mount time. 256m is plenty
      # — each iteration writes ~1 KiB and overwrite:true reuses names.
      - /tmp/bench-fs:uid=65532,gid=65532,mode=0700,size=256m
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }     # distroless image — no self-healthcheck possible
      http-upstream-mock: { condition: service_healthy }
    networks:
      - runtime-load

  # ---- prometheus: scrape runtime metrics (via collector) + self + SLO rules
  # Image pin is v3.11.1 (NOT v3.11.2): the v3.11.2 arm64 image on Docker
  # Hub has a known SIGSEGV on startup with zero log output — reproducible
  # on Mac arm64 with any config (even `global: {}`). v3.11.1 and v3.11.0
  # both work. The host's promtool CLI from brew remains at 3.11.2 and
  # works for rule validation — the CLI is independent of the server
  # image. ops/prometheus/.prometheus-version tracks the CLI version.
  prometheus:
    image: prom/prometheus:v3.11.1
    cpus: "1.0"
    mem_limit: 1g
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1h"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - ../prometheus/generated:/etc/prometheus/generated:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    depends_on:
      otel-collector: { condition: service_started }   # collector is distroless — no self-healthcheck (see collector block)
    networks:
      - runtime-load

  # ---- grafana: sanity visual during runs, NOT source of truth ---------
  grafana:
    image: grafana/grafana:11.3.0
    cpus: "0.5"
    mem_limit: 512m
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    networks:
      - runtime-load

  # ---- k6: load driver — isolated from runtime to not contaminate -------
  k6:
    image: grafana/k6:0.58.0
    # k6 is invoked ONLY via `docker compose run --rm k6 run ...`, never
    # as part of `compose up --wait`. The `manual` profile excludes it
    # from the default startup set. Without this, k6's absent command
    # lets the container exit(0) immediately — local Docker Desktop
    # tolerates this under --wait, but ubuntu-latest's compose v2 does
    # not and fails the up step. `compose run` ignores profiles.
    profiles: ["manual"]
    # Run as root so k6 can write handleSummary output into the
    # root-owned named volume. Load-testing containers are throwaway;
    # the privilege elevation has no production surface.
    user: "0:0"
    cpus: "1.0"
    mem_limit: 512m
    volumes:
      - ../load/scenarios:/scripts:ro
      # /lib is mounted alongside /scripts because scenarios do
      # `import { ... } from '../lib/common.js'` — k6 resolves
      # /scripts/../lib which requires /lib to exist in the container.
      - ../load/lib:/lib:ro
      - summaries:/summaries
    # No `command:` — scenarios are invoked via `docker compose run --rm k6 run ...`
    # from ops/load/lib/generate-report.sh (Bundle 5).
    networks:
      - runtime-load
    # k6 needs to reach runtime-adapters by DNS name; depends_on for
    # ordering (healthz is polled by the k6 script anyway).
    depends_on:
      runtime-adapters: { condition: service_started }

networks:
  runtime-load:
    driver: bridge

volumes:
  summaries:
