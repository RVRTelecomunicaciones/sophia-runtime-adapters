    alerting:
      name: GitDiffAvailabilityBurn
      labels:
        capability: "git.diff@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "git-diff-latency"
    objective: 99.0
    description: "99% of git.diff@v1 successful executions complete under 3s"
    labels:
