  - name: "git-clone-latency"
    objective: 99.0
    description: "99% of git.clone@v1 successful executions complete under 30s (high variance by repo size)"
    labels:
      capability: "git.clone@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.clone@v1"}[{{.window}}]))
          -
          sum(rate(runtime_adapters_execution_duration_seconds_bucket{capability="git.clone@v1",le="30"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.clone@v1"}[{{.window}}]))
    alerting:
