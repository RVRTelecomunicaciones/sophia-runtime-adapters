    description: "99% of git.commit@v1 successful executions complete under 500ms (SMOKE_CALIBRATED — F 2C.4, adapter floor p99≤9.0ms, 55× headroom for workload tail)"
    labels:
      capability: "git.commit@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.commit@v1"}[{{.window}}]))
          -
