          -
          sum(rate(runtime_adapters_execution_duration_seconds_bucket{capability="git.diff@v1",le="3"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.diff@v1"}[{{.window}}]))
    alerting:
