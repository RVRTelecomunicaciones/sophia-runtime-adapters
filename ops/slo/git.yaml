# Mixed calibration state — Phase 2C.4 / F (recalibrated 2026-05-02):
#   - git.status@v1: CALIBRATED — derived from a sustained smoke +
#     saturation_lite run with per-tree split (small-repo + dirty-tree).
#     Worst case dirty-tree p99 = 16.4ms (n=4724); aggregate over both
#     trees p99 = 21.7ms (n=220080 incl. saturation tail). Target
#     le=0.1 (100ms) gives 6.1× headroom over worst-tree p99. Honest
#     tier per D2C4F.8: N≥100, p99 stable, headroom ≥3× — passes all.
#   - git.clone@v1, git.diff@v1, git.commit@v1: SMOKE_CALIBRATED — rough
#     tier sustained run (clone n=60, diff n=301, commit n=90) measures
#     the ADAPTER FLOOR only. Real-world latency depends on workload
#     variables the bench cannot capture (repo size, network speed,
#     file count, binary diff, history depth). New le's are 6×–30× more
#     exigent than the prior PROVISIONAL values (clone 30→1, diff 3→0.5,
#     commit 2→0.5) yet retain 24×–162× headroom over the bench floor
#     to absorb workload tail. Cannot promote to CALIBRATED without
#     production telemetry covering real workloads (D2C4F.8 honest tiers).
#
# Bench observed (2026-05-02-baseline-v1, suite.js sustained run):
#   capability      | p99 (k6) | n    | new le | tier             | headroom
#   git.status@v1   | 16.4 ms  | 4724 | 0.1    | CALIBRATED       | 6.1×
#   git.clone@v1    | 6.1 ms   | 60   | 1      | SMOKE_CALIBRATED | 162×
#   git.diff@v1     | 20.4 ms  | 301  | 0.5    | SMOKE_CALIBRATED | 24×
#   git.commit@v1   | 9.0 ms*  | 90   | 0.5    | SMOKE_CALIBRATED | 55×
#   * git.commit p99 includes the 3-call clone+write+commit chain
#     (k6 scenario tag inheritance — see suite.js gitCommit). Pure
#     git.commit p99 is bounded above by 9.0 ms.
#
# Compose envelope: 2 CPU / 2 GiB runtime (ADR 0008).
# Re-running this calibration: `make load-baseline` (~63 min). Required
# when the envelope changes (CPU/mem/deps) or when performance-affecting
# adapter code lands. See docs/load-baseline.md and the calibration
# report at ops/slo/calibration-reports/2026-05-02-baseline-v1.md.
# ---
# 2C.4 / G additions: git-status-cancellation-rate, git-clone-cancellation-rate,
# git-diff-cancellation-rate, git-commit-cancellation-rate SLO(s) are PROVISIONAL.
# Cancellation objectives (99.0%) are operator hypotheses, not yet
# calibrated against real load. Recalibrate with evidence per
# docs/load-baseline.md when production traffic gives signal.

version: "prometheus/v1"
service: "runtime-adapters"
labels:
  team: "platform"
  adapter: "git"

slos:
  # ---- git.status@v1 -----------------------------------------------------
  - name: "git-status-availability"
    objective: 99.5
    description: "git.status@v1 non-error execution rate"
    labels:
      capability: "git.status@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="git.status@v1",status=~"failure|timeout"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="git.status@v1",status=~"success|failure|timeout"}[{{.window}}]))
    alerting:
      name: GitStatusAvailabilityBurn
      labels:
        capability: "git.status@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "git-status-latency"
    objective: 99.0
    description: "99% of git.status@v1 successful executions complete under 100ms (CALIBRATED — F 2C.4, dirty-tree p99=16.4ms, 6.1× headroom)"
    labels:
      capability: "git.status@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.status@v1"}[{{.window}}]))
          -
          sum(rate(runtime_adapters_execution_duration_seconds_bucket{capability="git.status@v1",le="0.1"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.status@v1"}[{{.window}}]))
    alerting:
      name: GitStatusLatencyBurn
      labels:
        capability: "git.status@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  # ---- git.clone@v1 ------------------------------------------------------
  - name: "git-clone-availability"
    objective: 99.0
    description: "git.clone@v1 non-error execution rate (partial classification applies — see D4.6)"
    labels:
      capability: "git.clone@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="git.clone@v1",status=~"failure|timeout"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="git.clone@v1",status=~"success|failure|timeout"}[{{.window}}]))
    alerting:
      name: GitCloneAvailabilityBurn
      labels:
        capability: "git.clone@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "git-clone-latency"
    objective: 99.0
    description: "99% of git.clone@v1 successful executions complete under 1s (SMOKE_CALIBRATED — F 2C.4, adapter floor p99=6.1ms, 162× headroom for workload tail)"
    labels:
      capability: "git.clone@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.clone@v1"}[{{.window}}]))
          -
          sum(rate(runtime_adapters_execution_duration_seconds_bucket{capability="git.clone@v1",le="1"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.clone@v1"}[{{.window}}]))
    alerting:
      name: GitCloneLatencyBurn
      labels:
        capability: "git.clone@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

