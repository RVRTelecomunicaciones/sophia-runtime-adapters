        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="git.commit@v1",status=~"success|failure|timeout"}[{{.window}}]))
    alerting:
      name: GitCommitAvailabilityBurn
      labels:
        capability: "git.commit@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "git-commit-latency"
    objective: 99.0
    description: "99% of git.commit@v1 successful executions complete under 2s"
    labels:
      capability: "git.commit@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.commit@v1"}[{{.window}}]))
          -
          sum(rate(runtime_adapters_execution_duration_seconds_bucket{capability="git.commit@v1",le="2"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="git.commit@v1"}[{{.window}}]))
    alerting:
      name: GitCommitLatencyBurn
      labels:
        capability: "git.commit@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  # ---- cancellation-rate SLOs (PROVISIONAL — Phase 2C.4 / G) -------------
  # Note: cancellation `total_query` is UNFILTERED (no status~ clause) by
  # design — cancellation can displace any status (including partial), so
  # the denominator is "all executions". This differs from the
  # *-availability SLOs above which filter to success|failure|timeout.

  - name: "git-status-cancellation-rate"
    objective: 99.0   # PROVISIONAL — cancellation rate < 1% (G, 2C.4)
    description: "git.status@v1 caller-cancellation rate (PROVISIONAL — see file header)"
    labels:
      capability: "git.status@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="git.status@v1",status="cancelled"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="git.status@v1"}[{{.window}}]))
    alerting:
      name: GitStatusCancellationRateBurn
      labels:
        capability: "git.status@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "git-clone-cancellation-rate"
