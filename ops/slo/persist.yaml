# PROVISIONAL — initial operational hypothesis (Phase 2C.4 sub-project G).
# Persist-availability objective (99.9%) is an operator hypothesis, not
# yet calibrated against real-load data. Recalibrate with evidence under
# the load envelope (ADR 0008, docs/load-baseline.md) when production
# traffic gives signal.
# Tracked: 2C.4 sub-project G; closes at v0.5.0.

version: "prometheus/v1"
service: "runtime-adapters"
labels:
  team: "platform"

slos:
  - name: "persist-availability"
    objective: 99.9   # PROVISIONAL — persist failure rate < 0.1% (G, 2C.4)
    description: "Receipt persistence reliability across all capabilities; denominator = execution.total + receipt.persist.failures (see SLI comment for rationale)"
    sli:
      events:
        # Two PromQL footguns in a row are guarded here:
        #
        # (1) `_total` suffix on the persist counter. The OTel name is
        #     `runtime_adapters.receipt.persist.failures` (no `.total`).
        #     The OTel Collector contrib prometheus exporter has
        #     `add_metric_suffixes: true` by default (we don't override),
        #     so it appends `_total` to counters that don't already end
        #     in `_total`. The exposed Prom name is therefore
        #     `runtime_adapters_receipt_persist_failures_total`.
        #     `runtime_adapters_execution_total` already has `_total` in
        #     its OTel name (`runtime_adapters.execution.total`), so the
        #     exporter does NOT double-suffix it. Mismatched selector
        #     names silently return empty vectors — surfaced by the
        #     manual nightly run 25210210809 (G closure post-B3,
        #     2026-05-01); fixed in B4.
        #     NOTE: ops/grafana/dashboards/runtime-overview.json:493
        #     uses the un-suffixed name and is currently broken (it
        #     just has not been exercised under real persist-fail load).
        #     Out of scope for B4; track as a follow-up dashboard fix.
        #
        # (2) `or vector(0)` ensures each operand is well-defined when
        #     the source counter has zero series. Without it, under 100%
        #     persist failure execution.total has no series at all (the
        #     contract test `Test_RecordExecution_OnlyAfterPersistSuccess`
        #     protects this invariant). The unguarded `+` would collapse
        #     the denominator to empty and the SLI rate1m would emit
        #     nothing. Surfaced by manual nightly 25174853836; fixed in B3.
        error_query: |
          sum(rate(runtime_adapters_receipt_persist_failures_total[{{.window}}])) or vector(0)
        # Denominator derivation (D2C4G.1):
        #   total_persist_attempts =
        #     successful_persists  (every execution.total fires AFTER a
        #                           successful persist per
        #                           execute_service.go RecordExecution
        #                           semantics post-B8/B9)
        #   + failed_persists       (receipt.persist.failures_total counter)
        #
        # Protected by Test_RecordExecution_OnlyAfterPersistSuccess in
        # internal/application/services/execute_service_test.go (§7 of this
        # spec). If that test ever fails, this denominator is wrong — fix
        # the ordering in execute_service before touching this SLI.
        total_query: |
          (
            (sum(rate(runtime_adapters_execution_total[{{.window}}])) or vector(0))
            +
            (sum(rate(runtime_adapters_receipt_persist_failures_total[{{.window}}])) or vector(0))
          )
    alerting:
      name: PersistAvailabilityBurn
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
