# PROVISIONAL — initial operational hypothesis (Phase 2C.4 sub-project G).
# Persist-availability objective (99.9%) is an operator hypothesis, not
# yet calibrated against real-load data. Recalibrate with evidence under
# the load envelope (ADR 0008, docs/load-baseline.md) when production
# traffic gives signal.
# Tracked: 2C.4 sub-project G; closes at v0.5.0.

version: "prometheus/v1"
service: "runtime-adapters"
labels:
  team: "platform"

slos:
  - name: "persist-availability"
    objective: 99.9   # PROVISIONAL — persist failure rate < 0.1% (G, 2C.4)
    description: "Receipt persistence reliability across all capabilities; denominator = execution.total + receipt.persist.failures (see SLI comment for rationale)"
    sli:
      events:
        # `or vector(0)` ensures the operand is well-defined when the
        # source counter has zero series. Without it, under 100% persist
        # failure runtime_adapters_receipt_persist_failures has data but
        # the rate() over an empty range can still vanish at the boundary;
        # safer to be explicit. Also keeps the SLI legible in idle periods.
        error_query: |
          sum(rate(runtime_adapters_receipt_persist_failures[{{.window}}])) or vector(0)
        # Denominator derivation (D2C4G.1):
        #   total_persist_attempts =
        #     successful_persists  (every execution.total fires AFTER a
        #                           successful persist per
        #                           execute_service.go RecordExecution
        #                           semantics post-B8/B9)
        #   + failed_persists       (receipt.persist.failures counter)
        #
        # Mathematically exact, BUT PromQL `vec_a + vec_b` returns the
        # intersection of label sets — when one operand has no series at
        # all, the addition collapses to the empty vector and the SLI
        # rate1m emits nothing. That's exactly what happens under 100%
        # persist failure: execution.total has no series (the contract
        # test `Test_RecordExecution_OnlyAfterPersistSuccess` protects
        # this invariant) so the unguarded sum was empty. The `or vector(0)`
        # wrappers force each operand to a one-element vector with value 0
        # when its source is empty, restoring the addition. Surfaced by
        # the manual nightly run 25174853836 (G closure validation,
        # 2026-04-30); fixed in B3.
        #
        # Protected by Test_RecordExecution_OnlyAfterPersistSuccess in
        # internal/application/services/execute_service_test.go (§7 of this spec).
        # If that test ever fails, this denominator is wrong — fix the
        # ordering in execute_service before touching this SLI.
        total_query: |
          (
            (sum(rate(runtime_adapters_execution_total[{{.window}}])) or vector(0))
            +
            (sum(rate(runtime_adapters_receipt_persist_failures[{{.window}}])) or vector(0))
          )
    alerting:
      name: PersistAvailabilityBurn
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
