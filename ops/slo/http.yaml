# Calibrated — Phase 2C.2 baseline 2026-04-25 (latest-baseline.json v2).
# Compose envelope: 2 CPU / 2 GiB runtime (ADR 0008).
# Changing these targets requires re-running `make load-baseline`
# under the same or a newer-but-declared envelope.
# ---
# 2C.4 / G additions: http-request-cancellation-rate SLO(s) are PROVISIONAL.
# Cancellation objectives (99.0%) are operator hypotheses, not yet
# calibrated against real load. Recalibrate with evidence per
# docs/load-baseline.md when production traffic gives signal.

version: "prometheus/v1"
service: "runtime-adapters"
labels:
  team: "platform"
  adapter: "http"

slos:
  - name: "http-request-availability"
    objective: 99.0
    description: "http.request@v1 non-error execution rate"
    labels:
      capability: "http.request@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="http.request@v1",status=~"failure|timeout"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="http.request@v1",status=~"success|failure|timeout"}[{{.window}}]))
    alerting:
      name: HttpRequestAvailabilityBurn
      labels:
        capability: "http.request@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "http-request-latency"
    objective: 99.0
    description: "99% of http.request@v1 successful executions complete under 500ms"
    labels:
      capability: "http.request@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="http.request@v1"}[{{.window}}]))
          -
          sum(rate(runtime_adapters_execution_duration_seconds_bucket{capability="http.request@v1",le="0.5"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="http.request@v1"}[{{.window}}]))
    alerting:
      name: HttpRequestLatencyBurn
      labels:
        capability: "http.request@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "http-request-cancellation-rate"
    objective: 99.0   # PROVISIONAL — cancellation rate < 1% (G, 2C.4)
    description: "http.request@v1 caller-cancellation rate (PROVISIONAL — see file header)"
    labels:
      capability: "http.request@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="http.request@v1",status="cancelled"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="http.request@v1"}[{{.window}}]))
    alerting:
      name: HttpRequestCancellationRateBurn
      labels:
        capability: "http.request@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
