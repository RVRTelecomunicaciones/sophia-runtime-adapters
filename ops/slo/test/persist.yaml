# Test SLO spec for the chaos comprehensive nightly run.
# Mirror of ops/slo/persist.yaml with service: "runtime-adapters-chaos-test"
# to avoid sloth_slo collision when both prod and test rules load in the
# same Prometheus instance.

version: "prometheus/v1"
service: "runtime-adapters-chaos-test"
labels:
  team: "platform"

slos:
  - name: "persist-availability"
    objective: 99.9
    description: "Receipt persistence reliability (chaos test variant; denominator derived per comment in total_query)"
    sli:
      events:
        # Two PromQL footguns guarded here — see ops/slo/persist.yaml for
        # full rationale:
        # (1) `_total` suffix: OTel Collector contrib appends `_total` to
        #     counters that don't end in `_total`, so the exposed Prom
        #     name is runtime_adapters_receipt_persist_failures_total
        #     (B4 fix; surfaced by manual nightly 25210210809 2026-05-01).
        # (2) `or vector(0)`: required because PromQL `+` collapses to
        #     empty when one operand has no series — exactly the state
        #     under sustained persist failure where execution.total has
        #     no data points (B3 fix; surfaced by manual nightly
        #     25174853836 2026-04-30).
        error_query: |
          sum(rate(runtime_adapters_receipt_persist_failures_total[{{.window}}])) or vector(0)
        # Denominator derivation: see ops/slo/persist.yaml for full
        # rationale (D2C4G.1) + the empty-vector fix from B3. Same SLI
        # selector logic as prod; this file only differs in service:
        # label so test rules don't collide with prod rules in the
        # chaos compose stack.
        total_query: |
          (
            (sum(rate(runtime_adapters_execution_total[{{.window}}])) or vector(0))
            +
            (sum(rate(runtime_adapters_receipt_persist_failures_total[{{.window}}])) or vector(0))
          )
    alerting:
      name: PersistAvailabilityBurn
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
