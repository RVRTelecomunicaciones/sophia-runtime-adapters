# Calibrated — Phase 2C.2 baseline 2026-04-25 (latest-baseline.json v2).
# Compose envelope: 2 CPU / 2 GiB runtime (ADR 0008).
# Changing these targets requires re-running `make load-baseline`
# under the same or a newer-but-declared envelope.
# ---
# 2C.4 / G additions: filesystem-read-file-cancellation-rate,
# filesystem-write-file-cancellation-rate SLO(s) are PROVISIONAL.
# Cancellation objectives (99.0%) are operator hypotheses, not yet
# calibrated against real load. Recalibrate with evidence per
# docs/load-baseline.md when production traffic gives signal.

version: "prometheus/v1"
service: "runtime-adapters"
labels:
  team: "platform"
  adapter: "filesystem"

slos:
  # ---- filesystem.read_file@v1 ------------------------------------------
  - name: "filesystem-read-file-availability"
    objective: 99.9
    description: "filesystem.read_file@v1 non-error execution rate"
    labels:
      capability: "filesystem.read_file@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="filesystem.read_file@v1",status=~"failure|timeout"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="filesystem.read_file@v1",status=~"success|failure|timeout"}[{{.window}}]))
    alerting:
      name: FilesystemReadFileAvailabilityBurn
      labels:
        capability: "filesystem.read_file@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "filesystem-read-file-latency"
    objective: 99.0
    description: "99% of filesystem.read_file@v1 successful executions complete under 100ms"
    labels:
      capability: "filesystem.read_file@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="filesystem.read_file@v1"}[{{.window}}]))
          -
          sum(rate(runtime_adapters_execution_duration_seconds_bucket{capability="filesystem.read_file@v1",le="0.1"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="filesystem.read_file@v1"}[{{.window}}]))
    alerting:
      name: FilesystemReadFileLatencyBurn
      labels:
        capability: "filesystem.read_file@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  # ---- filesystem.write_file@v1 -----------------------------------------
  - name: "filesystem-write-file-availability"
    objective: 99.9
    description: "filesystem.write_file@v1 non-error execution rate"
    labels:
      capability: "filesystem.write_file@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="filesystem.write_file@v1",status=~"failure|timeout"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="filesystem.write_file@v1",status=~"success|failure|timeout"}[{{.window}}]))
    alerting:
      name: FilesystemWriteFileAvailabilityBurn
      labels:
        capability: "filesystem.write_file@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "filesystem-write-file-latency"
    objective: 99.0
    description: "99% of filesystem.write_file@v1 successful executions complete under 500ms"
    labels:
      capability: "filesystem.write_file@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="filesystem.write_file@v1"}[{{.window}}]))
          -
          sum(rate(runtime_adapters_execution_duration_seconds_bucket{capability="filesystem.write_file@v1",le="0.5"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_duration_seconds_count{capability="filesystem.write_file@v1"}[{{.window}}]))
    alerting:
      name: FilesystemWriteFileLatencyBurn
      labels:
        capability: "filesystem.write_file@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  # ---- cancellation-rate SLOs (PROVISIONAL — Phase 2C.4 / G) -------------

  - name: "filesystem-read-file-cancellation-rate"
    objective: 99.0   # PROVISIONAL — cancellation rate < 1% (G, 2C.4)
    description: "filesystem.read_file@v1 caller-cancellation rate (PROVISIONAL — see file header)"
    labels:
      capability: "filesystem.read_file@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="filesystem.read_file@v1",status="cancelled"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="filesystem.read_file@v1"}[{{.window}}]))
    alerting:
      name: FilesystemReadFileCancellationRateBurn
      labels:
        capability: "filesystem.read_file@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning

  - name: "filesystem-write-file-cancellation-rate"
    objective: 99.0   # PROVISIONAL — cancellation rate < 1% (G, 2C.4)
    description: "filesystem.write_file@v1 caller-cancellation rate (PROVISIONAL — see file header)"
    labels:
      capability: "filesystem.write_file@v1"
    sli:
      events:
        error_query: |
          sum(rate(runtime_adapters_execution_total{capability="filesystem.write_file@v1",status="cancelled"}[{{.window}}]))
        total_query: |
          sum(rate(runtime_adapters_execution_total{capability="filesystem.write_file@v1"}[{{.window}}]))
    alerting:
      name: FilesystemWriteFileCancellationRateBurn
      labels:
        capability: "filesystem.write_file@v1"
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
