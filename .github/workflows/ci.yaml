name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit-contract:
    name: lint + unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: unit
        run: make test-unit
      - name: contract
        run: make test-contract
      - name: coverage gate — domain + application (≥85% per package)
        run: |
          # Per-package gate: every package under internal/(domain|application)
          # must report ≥85% coverage. This tolerates defensive branches and
          # empty marker methods (which Go's cover -func renders as 0.0% even
          # when executed — coverage is statement-weighted, and zero-statement
          # bodies produce that artifact).
          go test -race -count=1 -cover ./internal/domain/... ./internal/application/... 2>&1 | tee cov-pkg.txt
          awk '
            /^ok[ \t]/ && /coverage:/ {
              pkg = $2
              for (i = 1; i <= NF; i++) {
                if ($i == "coverage:") {
                  pct = $(i+1); sub(/%/, "", pct); val = pct + 0
                  if (val < 85.0) { print "gate failed:", pkg, val "%"; fail = 1 }
                }
              }
            }
            END { if (fail) exit 1; print "✅ coverage gate passed (per-package ≥85% on internal/domain + internal/application)" }
          ' cov-pkg.txt
        if: ${{ !cancelled() }}

  integration:
    name: integration (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: integration
        run: make test-integration

  e2e:
    name: e2e (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: e2e
        run: make test-e2e
