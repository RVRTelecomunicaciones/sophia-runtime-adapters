name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit-contract:
    name: lint + unit + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: vet
        run: go vet ./...
      - name: lint
        # `install-mode: goinstall` builds golangci-lint from source with
        # the Go toolchain already set up by setup-go (Go 1.26.x).
        # The default binary mode pulls a precompiled artifact built with
        # an older Go (e.g. v1.64.8 ships built with Go 1.24), which
        # rejects projects whose go.mod targets Go 1.26 with:
        #   "the Go language version (go1.24) used to build golangci-lint
        #    is lower than the targeted Go version (1.26)"
        # Building from source guarantees the lint binary's runtime Go
        # matches (or exceeds) the project's targeted version.
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
      - name: unit
        run: make test-unit
      - name: contract
        run: make test-contract
      - name: coverage gate — domain + application + obs/log (≥85% per package)
        run: |
          # Per-package gate: every package under internal/(domain|application)
          # and internal/infrastructure/obs/log must report ≥85% coverage. This
          # tolerates defensive branches and empty marker methods (which Go's
          # cover -func renders as 0.0% even when executed — coverage is
          # statement-weighted, and zero-statement bodies produce that artifact).
          go test -race -count=1 -cover ./internal/domain/... ./internal/application/... ./internal/infrastructure/obs/log/... 2>&1 | tee cov-pkg.txt
          awk '
            /^ok[ \t]/ && /coverage:/ {
              pkg = $2
              for (i = 1; i <= NF; i++) {
                if ($i == "coverage:") {
                  pct = $(i+1); sub(/%/, "", pct); val = pct + 0
                  if (val < 85.0) { print "gate failed:", pkg, val "%"; fail = 1 }
                }
              }
            }
            END { if (fail) exit 1; print "✅ coverage gate passed (per-package ≥85% on internal/domain + internal/application + internal/infrastructure/obs/log)" }
          ' cov-pkg.txt
        if: ${{ !cancelled() }}

  observability:
    name: observability (sloth + promtool + amtool + dashboard-linter + obs Go tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: install sloth (pinned)
        run: |
          set -euo pipefail
          VERSION="$(cat ops/slo/.sloth-version)"
          curl -sSL --fail \
            "https://github.com/slok/sloth/releases/download/v${VERSION}/sloth-linux-amd64" \
            -o /usr/local/bin/sloth
          chmod +x /usr/local/bin/sloth

      - name: install promtool (pinned)
        run: |
          set -euo pipefail
          VERSION="$(cat ops/prometheus/.prometheus-version)"
          TARBALL="prometheus-${VERSION}.linux-amd64.tar.gz"
          curl -sSL --fail \
            "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/${TARBALL}" \
            -o "/tmp/${TARBALL}"
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          sudo install -m 0755 "/tmp/prometheus-${VERSION}.linux-amd64/promtool" /usr/local/bin/promtool

      - name: install amtool (pinned)
        run: |
          set -euo pipefail
          VERSION="$(cat ops/alertmanager/.alertmanager-version)"
          TARBALL="alertmanager-${VERSION}.linux-amd64.tar.gz"
          curl -sSL --fail \
            "https://github.com/prometheus/alertmanager/releases/download/v${VERSION}/${TARBALL}" \
            -o "/tmp/${TARBALL}"
          tar -xzf "/tmp/${TARBALL}" -C /tmp
          sudo install -m 0755 "/tmp/alertmanager-${VERSION}.linux-amd64/amtool" /usr/local/bin/amtool

      - name: install dashboard-linter (pinned)
        run: |
          set -euo pipefail
          VERSION="$(cat ops/grafana/.dashboard-linter-version)"
          go install "github.com/grafana/dashboard-linter@${VERSION}"
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: version pin gate — sloth
        run: |
          set -euo pipefail
          sloth version 2>&1 | grep -qF "$(cat ops/slo/.sloth-version)"

      - name: version pin gate — promtool
        run: |
          set -euo pipefail
          promtool --version 2>&1 | grep -qF "$(cat ops/prometheus/.prometheus-version)"

      - name: version pin gate — amtool
        run: |
          set -euo pipefail
          amtool --version 2>&1 | grep -qF "$(cat ops/alertmanager/.alertmanager-version)"

      - name: sloth idempotency gate
        run: |
          set -euo pipefail
          # Regenerate into a temp dir and diff against checked-in output.
          # The hand-written promtool test fixture (slo_rules.test.yaml) is
          # excluded: sloth does not emit it, so it cannot appear in the
          # regenerated tree.
          #
          # ops/slo/test/ — test SLO specs for the B6 chaos canary (rendered
          # with --slo-period-windows-path + --default-slo-period 5m via
          # `make chaos-render-rules`; separate invocation, not part of this gate).
          # ops/slo/windows/ — custom Sloth window catalog for the 5m period;
          # it is an AlertWindows manifest, not an SLO spec, and Sloth fails to
          # parse it as one. Both subdirs must be excluded here.
          mkdir -p /tmp/slo-regen
          sloth generate \
            --fs-exclude '.*/test/.*|.*/windows/.*' \
            --input ops/slo/ \
            --out /tmp/slo-regen/

          # Normalize the embedded sloth version string before comparing.
          # The Linux GitHub-release binary at v0.16.0 emits
          # `sloth_version: v0.16.0` while the macOS brew binary at the
          # same version emits `sloth_version: 0.16.0` (the prefix is
          # injected via a Linux-only ldflag during the release build).
          # The committed files were regenerated locally on macOS, so
          # they carry the un-prefixed form. Same version, same rules,
          # only the embedded label differs — strip the `v` from the
          # CI regen output so the diff focuses on actual content drift.
          sed -i 's/sloth_version: v\([0-9]\)/sloth_version: \1/g' /tmp/slo-regen/*.yaml
          sed -i 's/Code generated by Sloth (v\([0-9]\)/Code generated by Sloth (\1/g' /tmp/slo-regen/*.yaml

          # Exclusions:
          #   - *.test.yaml: hand-written promtool fixtures (sloth never emits these)
          #   - test: Phase 2C.3 chaos test rules subdirectory (per-spec rendered
          #     output under ops/prometheus/generated/test/, gated separately by
          #     `make chaos-render-rules-check` in chaos-canary-e2e job)
          diff -ru --exclude='*.test.yaml' --exclude='test' ops/prometheus/generated/ /tmp/slo-regen/

      - name: promtool check rules (infra + generated SLOs)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s extglob
          # Exclude *.test.yaml — those are promtool test-rules fixtures,
          # not rule files.
          promtool check rules \
            ops/prometheus/rules/!(*.test).yaml \
            ops/prometheus/generated/!(*.test).yaml

      - name: promtool test rules (infra + generated fixtures)
        run: |
          set -euo pipefail
          promtool test rules \
            ops/prometheus/rules/*.test.yaml \
            ops/prometheus/generated/*.test.yaml

      - name: amtool check-config
        run: |
          set -euo pipefail
          amtool check-config ops/alertmanager/alertmanager.yaml

      - name: dashboard-linter lint
        run: |
          set -euo pipefail
          # dashboard-linter accepts a single dashboard file; iterate.
          for f in ops/grafana/dashboards/*.json; do
            echo "linting $f"
            dashboard-linter lint -c ops/grafana/dashboards/.lint "$f"
          done

      - name: go test — obs (race)
        run: go test -race -count=1 ./internal/infrastructure/obs/...

      - name: go test — ops/slo (sloth tag)
        run: go test -tags sloth ./ops/slo/...

      - name: go test — ops/alertmanager (alertmanager tag)
        run: go test -tags alertmanager ./ops/alertmanager/...

      - name: go test — ops/grafana (dashboards tag)
        run: go test -tags dashboards ./ops/grafana/...

      - name: Validate 2C.2 ops configs
        run: |
          set -euo pipefail
          # Compose files (v2 schema).
          docker compose -f ops/local/compose.yaml config -q
          docker compose -f ops/local/compose.ci-smoke.yaml config -q
          # OTel Collector config — uses pinned container tag matching compose.
          ./ops/otel-collector/scripts/validate-config.sh
          # Prometheus config (via promtool in a temp container).
          # The image's default ENTRYPOINT is `/bin/prometheus`; passing
          # `promtool` as the first arg makes prometheus treat it as an
          # unknown flag ("unexpected promtool"). Override the entrypoint
          # so docker invokes the promtool binary directly.
          #
          # `promtool check config` also resolves every rule_file listed
          # in the config and verifies it parses. The config uses absolute
          # paths (/etc/prometheus/rules/* + /etc/prometheus/generated/*)
          # because that is where compose mounts them at runtime; we
          # mirror that layout in the validation container by mounting the
          # same source directories at the same in-container paths.
          docker run --rm \
            --entrypoint promtool \
            -v "$(pwd)/ops/local/prometheus.yaml:/tmp/prometheus.yaml:ro" \
            -v "$(pwd)/ops/prometheus/rules:/etc/prometheus/rules:ro" \
            -v "$(pwd)/ops/prometheus/generated:/etc/prometheus/generated:ro" \
            prom/prometheus:v3.11.2 \
            check config /tmp/prometheus.yaml
          echo "✅ 2C.2 ops configs all valid"

  integration:
    name: integration (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Layer 3 (D2C4AB.16 / spec §9.3): BuildRuntime aborts under
    # CI=true unless RUNTIME_TENANT=test. This job runs Go tests
    # directly against testcontainer Postgres — it IS test
    # infrastructure, so declare it explicitly. Without this, the
    # mode lock (correctly) refuses to instantiate the runtime.
    env:
      RUNTIME_TENANT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: integration
        run: make test-integration

  e2e:
    name: e2e (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Layer 3 — same rationale as the integration job above.
    env:
      RUNTIME_TENANT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: e2e
        run: make test-e2e

  # --------------------------------------------------------------------
  # Phase 2C.2 — load ops lint
  # --------------------------------------------------------------------
  load-ops-lint:
    name: load ops lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck on ops/load + collector scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck \
            ops/load/lib/*.sh \
            ops/otel-collector/scripts/*.sh

      # k6 is NOT pre-installed on ubuntu-latest — install via the
      # Grafana-official setup action. The version pin in
      # ops/load/.k6-version governs the grafana/k6 container that
      # compose runs for actual load tests — the host-level k6 here
      # is only used for `k6 inspect`, which is a static parse that
      # works across k6 major versions. We don't re-enforce the pin
      # at the host level because the published v0.58.0 GitHub release
      # assets are stale and silently re-route to v1.x, making
      # strict-grep unreliable.
      - uses: grafana/setup-k6-action@v1

      - name: Log k6 version
        run: |
          k6 version | head -1
          echo "Pinned compose k6 (authoritative): $(cat ops/load/.k6-version)"

      - name: k6 inspect all scenarios
        run: |
          set -euo pipefail
          for f in ops/load/scenarios/*.js; do
            echo "=== $f ==="
            k6 inspect "$f"
          done

  # --------------------------------------------------------------------
  # Phase 2C.2 — load smoke (advisory, PR only, NEVER gates CI)
  # --------------------------------------------------------------------
  load-smoke:
    name: load-smoke (advisory, PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true            # NEVER fails the overall CI run
    permissions:
      contents: read                    # required by actions/checkout@v4 (GHA reduces unlisted permissions to none when permissions: is set explicitly)
      pull-requests: write              # to post PR comment
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker + Compose
        run: |
          docker version
          docker compose version

      - name: Start CI smoke stack
        run: |
          docker compose -f ops/local/compose.ci-smoke.yaml up -d --wait

      - name: Wait for runtime readiness (inside compose network)
        run: |
          # Readiness probe runs INSIDE the compose network. D2C2.18 /
          # A2C2.27: compose.ci-smoke.yaml does NOT publish runtime:8080
          # to the host. Use alpine:3.19 as the probe container —
          # grafana/k6:0.58.0 has no /bin/sh on ubuntu-latest Docker
          # (the original plan assumed an alpine-based k6; the current
          # image ships without a shell).
          docker run --rm --network runtime-load-smoke_runtime-load-smoke \
            alpine:3.19 sh -c '
              for i in $(seq 1 30); do
                wget -q -O- http://runtime-adapters:8080/healthz && exit 0
                sleep 1
              done
              echo "runtime-adapters never became ready"
              exit 1
            '

      - name: Run k6 smoke
        id: k6
        continue-on-error: true
        run: |
          # Pre-create /tmp/smoke with wide perms BEFORE Docker touches
          # it — if `docker run -v /tmp/smoke:/out` mounts a missing
          # path, Docker creates it as root-owned and the runner user
          # loses write access for subsequent comment.md redirect.
          mkdir -p /tmp/smoke
          chmod 777 /tmp/smoke
          # handleSummary() in smoke.js writes /summaries/smoke-summary.json
          # (D2C2.17 — sole source, no --summary-export).
          docker compose -f ops/local/compose.ci-smoke.yaml run --rm \
            -v /tmp/smoke:/summaries k6 run /scripts/smoke.js

      - name: Copy smoke summary from compose volume
        if: always()
        run: |
          # If k6 failed the summary may still exist (partial). Pull it.
          docker run --rm \
            -v "runtime-load-smoke_smoke-summaries:/in:ro" \
            -v "/tmp/smoke:/out" \
            alpine:3.19 \
            sh -c 'cp /in/smoke-summary.json /out/smoke-summary.json 2>/dev/null || true'
          # Re-open perms — the docker run above may have rewritten the
          # dir owner; the next step writes comment.md as the runner user.
          sudo chmod -R 777 /tmp/smoke

      - name: Process summary + post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          K6_EXIT_CODE: ${{ steps.k6.outcome == 'success' && '0' || '1' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./ops/load/lib/ci-smoke-comment.sh \
            /tmp/smoke/smoke-summary.json \
            ops/slo/calibration-reports/latest-baseline.json \
            "$K6_EXIT_CODE" \
            > /tmp/smoke/comment.md
          # Use --edit-last if we already posted on this PR to avoid comment spam.
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file /tmp/smoke/comment.md

      - name: Teardown
        if: always()
        run: docker compose -f ops/local/compose.ci-smoke.yaml down -v

  # --------------------------------------------------------------------
  # Phase 2C.3 — per-PR E2E canary (B6)
  # --------------------------------------------------------------------
  chaos-canary-e2e:
    name: chaos-canary-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Sloth (pinned)
        run: |
          set -euo pipefail
          VERSION="$(cat ops/slo/.sloth-version)"
          curl -sSL --fail \
            "https://github.com/slok/sloth/releases/download/v${VERSION}/sloth-linux-amd64" \
            -o /usr/local/bin/sloth
          chmod +x /usr/local/bin/sloth

      - name: chaos-render-rules-check (idempotency)
        run: make chaos-render-rules-check

      - name: Run canary
        run: make chaos-canary

      # NOTE: the canary's t.Cleanup runs DumpDiagnostics BEFORE ComposeDown
      # when t.Failed() is true (see test/chaos/e2e/breadcrumbs.go), writing
      # to <repo>/chaos-dump/. Do NOT run `make chaos-dump` here as a second
      # post-step — by the time GHA evaluates `if: failure()` the compose stack
      # is already torn down and every probe would 404, overwriting the useful
      # in-test dump with empty failures.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-canary-diagnostics
          path: chaos-dump/
          retention-days: 14
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # Phase 2C.2 — load report schema (tolerates pre-first-calibration)
  # --------------------------------------------------------------------
  load-report-schema:
    name: load report schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run calibration-reports schema tests
        run: |
          # Pre-first-calibration state (D2C2.14): TestLatestBaseline_Schema
          # + TestCalibrationReport_Structure skip when artifacts absent.
          # TestCalibrationReport_TemplateRenderable always runs.
          go test -tags loadreport -v ./ops/slo/calibration-reports/...

  # --------------------------------------------------------------------
  # Phase 2C.4 / A+B — Layer 1: secret scanning (gitleaks)
  # --------------------------------------------------------------------
  # Per D2C4AB.16 + I-AB.2. Catches accidental credential commits to
  # any branch via gitleaks's ~100 default patterns (PagerDuty routing
  # keys, Slack incoming webhook URLs, Linear API tokens, AWS keys,
  # GitHub PATs). Runs on every PR and every push to main.
  secret-scan:
    name: secret-scan (gitleaks, Layer 1)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read    # gitleaks-action lists PR commits via the GH API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history — gitleaks scans the full diff
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------
  # Phase 2C.4 / A+B — Layer 2: env var name guard
  # --------------------------------------------------------------------
  # Per D2C4AB.16 + I-AB.2 + spec §9.2. Rejects any env var with
  # PROD_ prefix or infix in the CI environment. Convention: prod
  # credentials use PROD_ (PAGERDUTY_PROD_ROUTING_KEY,
  # LINEAR_PROD_API_TOKEN); test-tenant vars omit it.
  env-var-guard:
    name: env-var-guard (Layer 2)
    runs-on: ubuntu-latest
    steps:
      - name: Reject prod credential env vars
        run: |
          set -euo pipefail
          # `env | sed 's/=.*//'` extracts the NAME (left of the first
          # '=') so we MUST not match against values (which could
          # legitimately contain the substring 'PROD' inside a path).
          # The grep -E pattern matches any env var whose NAME starts
          # with PROD_ or contains _PROD_ or _PRODUCTION_.
          leaked=$(env | sed 's/=.*//' | grep -E '^(PROD_|.*_PROD_|.*_PRODUCTION_)' || true)
          if [ -n "$leaked" ]; then
            echo "FATAL: production credential env vars present in CI environment:"
            echo "$leaked"
            echo
            echo "Per D2C4AB.16 / I-AB.2, CI never loads production credentials."
            echo "If a workflow added these vars, remove them. If a GitHub Secret"
            echo "with a PROD_ prefix exists, it must NOT be exposed to this job."
            exit 1
          fi
          echo "env-var-guard PASS: no PROD_ env vars in CI"

  # --------------------------------------------------------------------
  # Phase 2C.4 / D — B1.12: 4 gate jobs for the log signal pipeline
  # --------------------------------------------------------------------
  # Per A2C4D.5: closure criterion 10 lands here as explicit jobs (no
  # plan-time deferrals). Each gate is independent + failable on its own.

  loki-config-verify:
    name: loki-config-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Loki config
        run: |
          set -euo pipefail
          LOKI_VERSION=$(cat ops/loki/.loki-version)
          # The Loki binary's `-verify-config` exercises schema_config,
          # storage_config, ruler, distributor.otlp_config and limits.
          # The file_storage extension's directory existence check is
          # NOT in scope here (collector-side concern, covered by
          # otelcol-config-verify with a tmpdir bind mount).
          docker run --rm \
            -v "$PWD/ops/loki/loki.yaml:/etc/loki/loki.yaml:ro" \
            "grafana/loki:$LOKI_VERSION" \
            -verify-config -config.file=/etc/loki/loki.yaml

  otelcol-config-verify:
    name: otelcol-config-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate otel-collector config
        run: |
          set -euo pipefail
          # The contrib collector's `validate` subcommand exits 0 when
          # the config parses cleanly. The file_storage extension
          # checks its directory exists at validate time, so we bind
          # a tmpdir matching the production mount point.
          tmpdir=$(mktemp -d)
          docker run --rm \
            -v "$PWD/ops/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro" \
            -v "$tmpdir:/var/lib/otel/checkpoints" \
            otel/opentelemetry-collector-contrib:0.106.1 \
            validate --config=/etc/otelcol/config.yaml
          rm -rf "$tmpdir"

  compose-logs-syntax:
    name: compose-logs-syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (base + logs)
        run: docker compose -f ops/local/compose.yaml -f ops/local/compose.logs.yaml config --quiet
      - name: docker compose config (base + receivers + logs)
        run: |
          # The receivers overlay is the A+B file. The 3-way merge must
          # also resolve cleanly because operators run all three
          # combined when smoking real receivers AND log ingestion.
          docker compose \
            -f ops/local/compose.yaml \
            -f ops/local/compose.receivers.yaml \
            -f ops/local/compose.logs.yaml \
            config --quiet

  loki-label-cardinality-check:
    name: loki-label-cardinality-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Cardinality allowlist + denylist
        # Build-tag gated test: enforces D2C4D.8 by reading both
        # ops/loki/loki.yaml (default_resource_attributes_as_index_labels
        # block) AND ops/otel-collector/config.yaml (resource[<key>]
        # promotion via filelog operators). Test source is at
        # ops/loki/loki_labels_test.go (B1.9).
        run: go test -tags loki_labels ./ops/loki/...
